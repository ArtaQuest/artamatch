name: Build, test and deploy to Pages

on:
  push:
    # The work is staged on feature/artamatch and previewed live from there; main takes over once
    # it is merged. Pages hosts one site, so whichever of these pushed last is what is served.
    branches: [main, feature/artamatch]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A queued deploy should wait for the running one rather than cancel it — cancelling mid-deploy is
# how a Pages site ends up serving half of one build and half of another.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # The verification gate. tests/golden.json is committed, so the Swiss Ephemeris comparison
      # runs here without the 300 MB .se1 files — a regression in the ephemeris fails the build
      # rather than shipping quietly.
      - name: Typecheck
        run: npx tsc -b
      # Contrast is arithmetic, so it is asserted rather than reviewed. The brand allows two hues
      # and no third accent, so the only lever is lightness — this fails if any ink drops below
      # 4.5:1 on the surface it is used against.
      - name: Contrast
        run: node tools/contrast.mjs
      - name: Test against Swiss Ephemeris golden data
        run: npm test

      - name: Build
        run: npx vite build

      # Load the built bundle in a real browser: console errors, page errors, horizontal overflow
      # and broken meter layout all fail the deploy instead of shipping quietly.
      - name: Browser smoke (screenshots + layout assertions)
        run: |
          npx playwright install --with-deps chromium
          node tools/screenshot.mjs "$PWD/dist" /tmp/shots

      # Pages serves no fallback for client-side routes; copying index.html to 404.html means a
      # deep link resolves instead of showing GitHub's own 404 page.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/feature/artamatch')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
